<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStream V3 | Emergency Blood Radar</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .map-container {
            height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        .sidebar {
            position: relative;
            z-index: 10;
            height: 100vh;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 10px 0 40px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        
        .blood-card {
            background: rgba(20, 25, 45, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid transparent;
        }
        .blood-card:hover {
            transform: translateY(-2px);
            background: rgba(25, 30, 55, 0.8);
            border-left-color: #ef4444;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.1);
        }
        
        /* Custom Leaflet Markers with Glowing Rings */
        .hospital-icon {
            background: #ef4444;
            border-radius: 50%;
            border: 3px solid #030712;
            box-shadow: 0 0 20px #ef4444;
            animation: pulse-hospital 2s infinite;
        }
        .donor-icon {
            background: #3b82f6;
            border-radius: 50%;
            border: 2px solid #030712;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }
        .active-donor-icon {
            background: #10b981;
            border-radius: 50%;
            border: 3px solid #030712;
            box-shadow: 0 0 25px #10b981;
            animation: pulse-active-donor 1.5s infinite;
        }

        @keyframes pulse-hospital {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes pulse-active-donor {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .tracking-overlay {
            position: absolute;
            bottom: 24px;
            left: 400px;
            z-index: 20;
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            width: 340px;
        }

        /* Dark mode custom scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HOSPITAL_COORD = [37.7749, -122.4194]; // SF General Hospital

        const App = () => {
            const [recipientType, setRecipientType] = useState('O+');
            const [matches, setMatches] = useState([]);
            const [activeDispatch, setActiveDispatch] = useState(null);
            
            const mapRef = useRef(null);
            const markersRef = useRef({});
            const hospitalMarkerRef = useRef(null);
            const trackingInterval = useRef(null);

            const bloodTypes = ['O-', 'O+', 'A-', 'A+', 'B-', 'B+', 'AB-', 'AB+'];

            // Initialize Map
            useEffect(() => {
                // Leaflet setup with premium dark tile layer
                mapRef.current = L.map('map-bg', { zoomControl: false }).setView(HOSPITAL_COORD, 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; CartoDB &copy; OpenStreetMap'
                }).addTo(mapRef.current);

                const hospitalIcon = L.divIcon({ className: 'hospital-icon', iconSize: [24, 24] });
                hospitalMarkerRef.current = L.marker(HOSPITAL_COORD, { icon: hospitalIcon }).addTo(mapRef.current)
                    .bindTooltip("<b>SF General Trauma Center</b><br>Emergency Intake Center", { permanent: false, theme: 'dark' });

                return () => {
                    if (mapRef.current) mapRef.current.remove();
                };
            }, []);

            // Fetch Donors
            const fetchMatches = async () => {
                try {
                    const res = await fetch(`/api/matches/${recipientType}`);
                    const data = await res.json();
                    setMatches(data);
                    updateMapMarkers(data);
                } catch (error) {
                    console.error("Error fetching matches:", error);
                }
            };

            useEffect(() => {
                fetchMatches();
            }, [recipientType]);

            // Update Leaflet Markers
            const updateMapMarkers = (donors) => {
                // Clear old donor markers
                Object.values(markersRef.current).forEach(marker => mapRef.current.removeLayer(marker));
                markersRef.current = {};

                const icon = L.divIcon({ className: 'donor-icon', iconSize: [16, 16] });

                donors.forEach(d => {
                    const marker = L.marker([d.lat, d.lng], { icon })
                        .addTo(mapRef.current)
                        .bindTooltip(`<b>${d.name} (${d.bloodType})</b><br>Match Score: ${d.aiScore}%`, { direction: 'top' });
                    markersRef.current[d.id] = marker;
                });
            };

            // Dispatch Logic
            const handleDispatch = async (donorId) => {
                if (activeDispatch) return alert("A dispatch is already in progress.");
                try {
                    const res = await fetch('/api/dispatch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ donorId, transportType: 'Autonomous Medical Drone' })
                    });
                    const data = await res.json();
                    setActiveDispatch(data);
                    startTracking(data.id);

                    // Update UI Map marker to active state
                    if(markersRef.current[donorId]) {
                        markersRef.current[donorId].setIcon(L.divIcon({ className: 'active-donor-icon', iconSize: [20, 20] }));
                    }
                } catch (err) {
                    console.error("Dispatch error:", err);
                }
            };

            const startTracking = (dispatchId) => {
                if(trackingInterval.current) clearInterval(trackingInterval.current);
                
                trackingInterval.current = setInterval(async () => {
                    try {
                        const res = await fetch(`/api/track/${dispatchId}`);
                        const data = await res.json();
                        setActiveDispatch(data);
                        
                        // Move marker physically on map
                        if(markersRef.current[data.donorId]) {
                            markersRef.current[data.donorId].setLatLng([data.currentLat, data.currentLng]);
                        }

                        if (data.status === 'Arrived') {
                            clearInterval(trackingInterval.current);
                            setTimeout(() => {
                                alert(`Emergency delivery successful! ${data.transportType} arrived at SF General Hospital.`);
                                setActiveDispatch(null);
                                fetchMatches(); // reset
                            }, 1000);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }, 1500);
            };

            return (
                <div className="flex w-full h-screen relative">
                    
                    {/* LEAFLET MAP BACKGROUND */}
                    <div id="map-bg" className="map-container"></div>

                    {/* SIDEBAR DISPATCH CENTER */}
                    <div className="sidebar w-full max-w-sm p-6 flex flex-col justify-between">
                        <div>
                            <header className="mb-6">
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="text-3xl text-red-500 animate-pulse">🩸</span>
                                    <h1 className="text-2xl font-black text-white tracking-tight">LifeStream V3</h1>
                                </div>
                                <p className="text-[10px] font-extrabold text-red-500 uppercase tracking-widest">Medical Dispatch Radar</p>
                            </header>

                            <div className="bg-slate-950/60 border border-white/5 rounded-2xl p-4 mb-6">
                                <label className="text-[10px] font-extrabold text-zinc-400 uppercase tracking-wider mb-3 block">Target Recipient Type</label>
                                <div className="grid grid-cols-4 gap-2">
                                    {bloodTypes.map(type => (
                                        <button
                                            key={type}
                                            onClick={() => setRecipientType(type)}
                                            className={`h-11 rounded-xl font-bold text-xs transition-all ${
                                                recipientType === type 
                                                ? 'bg-red-600 text-white shadow-lg shadow-red-600/30' 
                                                : 'bg-zinc-900/60 text-zinc-400 border border-white/5 hover:border-zinc-700 hover:text-white'
                                            }`}
                                        >
                                            {type}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-3">
                                <h3 className="text-[10px] font-extrabold text-zinc-400 uppercase tracking-wider sticky top-0 bg-[#0a0f1e]/90 py-1">Geospatial Matches</h3>
                                
                                <div className="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                                    {matches.map(donor => (
                                        <div key={donor.id} className="blood-card p-4 rounded-2xl flex flex-col gap-3">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold text-sm text-white flex items-center gap-1.5">
                                                        {donor.name}
                                                        <span className="bg-red-950/50 text-red-400 border border-red-500/20 px-2 py-0.5 rounded-lg text-[9px] font-extrabold">{donor.bloodType}</span>
                                                    </h4>
                                                    <p className="text-[10px] text-zinc-400 font-semibold mt-1">📍 {donor.distanceMiles} miles away</p>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-[10px] font-bold text-emerald-400 bg-emerald-950/30 border border-emerald-500/20 px-2 py-1 rounded-full">
                                                        {donor.aiScore}% Match
                                                    </span>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleDispatch(donor.id)}
                                                disabled={!!activeDispatch}
                                                className="w-full bg-white text-black py-2.5 rounded-xl text-xs font-bold hover:bg-zinc-200 transition-colors disabled:opacity-30 disabled:pointer-events-none"
                                            >
                                                Deploy Medical Drone
                                            </button>
                                        </div>
                                    ))}
                                    {matches.length === 0 && <p className="text-xs text-zinc-500 text-center py-10 font-bold">No compatible donors found.</p>}
                                </div>
                            </div>
                        </div>

                        {/* Footer Status */}
                        <div className="border-t border-white/5 pt-4 text-center">
                            <span className="inline-flex items-center gap-1.5 text-[9px] font-bold text-zinc-500 uppercase tracking-widest">
                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                Dispatch System Operational
                            </span>
                        </div>
                    </div>

                    {/* LIVE TRACKING OVERLAY */}
                    {activeDispatch && (
                        <div className="tracking-overlay animate-[slide-in_0.3s_ease-out]">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-2">
                                    <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></div>
                                    <h3 className="font-extrabold text-white text-xs tracking-wider">ACTIVE TELEMETRY</h3>
                                </div>
                                <span className="bg-red-500/10 border border-red-500/20 text-red-400 text-[9px] px-2.5 py-0.5 rounded-full font-black uppercase tracking-wider">
                                    {activeDispatch.transportType}
                                </span>
                            </div>
                            
                            <div className="bg-zinc-950/60 border border-white/5 rounded-xl p-4 mb-4 flex justify-between items-center">
                                <div>
                                    <p className="text-[9px] font-bold text-zinc-500 uppercase tracking-wider">Est. Arrival</p>
                                    <p className="text-2xl font-black text-white">{activeDispatch.etaMinutes} min</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-[9px] font-bold text-zinc-500 uppercase tracking-wider">Cold-Chain Temp</p>
                                    <p className={`text-2xl font-black ${activeDispatch.tempCelsius > 4.5 ? 'text-amber-500' : 'text-emerald-400'}`}>
                                        {activeDispatch.tempCelsius.toFixed(1)}°C
                                    </p>
                                </div>
                            </div>

                            <div className="text-[11px] text-zinc-400 leading-relaxed font-semibold">
                                Drone payload loaded from <strong className="text-white">{activeDispatch.donorName}</strong>. En route to SF Trauma Center.
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
