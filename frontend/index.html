<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeStream V3 | Uber for Blood</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; min-height: 100vh; margin: 0; overflow: hidden; }
        .map-container { height: 100vh; width: 100%; position: absolute; top: 0; left: 0; z-index: 0; }
        
        .sidebar { position: relative; z-index: 10; height: 100vh; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-right: 1px solid #e2e8f0; box-shadow: 5px 0 25px rgba(0,0,0,0.05); overflow-y: auto; }
        
        .blood-card { transition: all 0.2s ease; border-left: 4px solid transparent; }
        .blood-card:hover { transform: translateX(4px); border-left-color: #ef4444; }
        
        /* Custom Leaflet Markers */
        .hospital-icon { background: #dc2626; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px rgba(220, 38, 38, 0.6); animation: pulse-map 2s infinite; }
        .donor-icon { background: #3b82f6; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .active-donor-icon { background: #10b981; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }

        @keyframes pulse-map {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .tracking-overlay { position: absolute; bottom: 20px; left: 420px; z-index: 20; background: white; border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 320px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const HOSPITAL_COORD = [37.7749, -122.4194]; // SF

        const App = () => {
            const [recipientType, setRecipientType] = useState('O+');
            const [matches, setMatches] = useState([]);
            const [activeDispatch, setActiveDispatch] = useState(null);
            
            const mapRef = useRef(null);
            const markersRef = useRef({});
            const hospitalMarkerRef = useRef(null);
            const trackingInterval = useRef(null);

            const bloodTypes = ['O-', 'O+', 'A-', 'A+', 'B-', 'B+', 'AB-', 'AB+'];

            // Initialize Map
            useEffect(() => {
                mapRef.current = L.map('map-bg', { zoomControl: false }).setView(HOSPITAL_COORD, 13);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(mapRef.current);

                const hospitalIcon = L.divIcon({ className: 'hospital-icon', iconSize: [24, 24] });
                hospitalMarkerRef.current = L.marker(HOSPITAL_COORD, { icon: hospitalIcon }).addTo(mapRef.current)
                    .bindTooltip("<b>SF General Hospital</b><br>Recipient Location", { permanent: false });

                return () => mapRef.current.remove();
            }, []);

            // Fetch Donors
            const fetchMatches = async () => {
                try {
                    const res = await fetch(`http://localhost:3000/api/matches/${recipientType}`);
                    const data = await res.json();
                    setMatches(data);
                    updateMapMarkers(data);
                } catch (error) {
                    console.error("Error fetching matches:", error);
                }
            };

            useEffect(() => {
                fetchMatches();
            }, [recipientType]);

            // Update Leaflet Markers
            const updateMapMarkers = (donors) => {
                // Clear old donor markers
                Object.values(markersRef.current).forEach(marker => mapRef.current.removeLayer(marker));
                markersRef.current = {};

                const icon = L.divIcon({ className: 'donor-icon', iconSize: [16, 16] });

                donors.forEach(d => {
                    const marker = L.marker([d.lat, d.lng], { icon })
                        .addTo(mapRef.current)
                        .bindTooltip(`<b>${d.name}</b><br>Score: ${d.aiScore}%`, { direction: 'top' });
                    markersRef.current[d.id] = marker;
                });
            };

            // Dispatch Logic
            const handleDispatch = async (donorId) => {
                if (activeDispatch) return alert("A dispatch is already in progress.");
                try {
                    const res = await fetch('http://localhost:3000/api/dispatch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ donorId, transportType: 'Autonomous Drone' })
                    });
                    const data = await res.json();
                    setActiveDispatch(data);
                    startTracking(data.id);

                    // Update UI Map marker to active state
                    if(markersRef.current[donorId]) {
                        markersRef.current[donorId].setIcon(L.divIcon({ className: 'active-donor-icon', iconSize: [20, 20] }));
                    }
                } catch (err) {
                    console.error("Dispatch error:", err);
                }
            };

            const startTracking = (dispatchId) => {
                if(trackingInterval.current) clearInterval(trackingInterval.current);
                
                trackingInterval.current = setInterval(async () => {
                    try {
                        const res = await fetch(`http://localhost:3000/api/track/${dispatchId}`);
                        const data = await res.json();
                        setActiveDispatch(data);
                        
                        // Move marker physically on map
                        if(markersRef.current[data.donorId]) {
                            markersRef.current[data.donorId].setLatLng([data.currentLat, data.currentLng]);
                        }

                        if (data.status === 'Arrived') {
                            clearInterval(trackingInterval.current);
                            setTimeout(() => {
                                alert(`${data.transportType} has arrived with blood from ${data.donorName}!`);
                                setActiveDispatch(null);
                                fetchMatches(); // reset
                            }, 1000);
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }, 1500); // Poll every 1.5s
            };

            return (
                <div className="flex w-full h-screen relative">
                    
                    {/* LEAFLET MAP BACKGROUND */}
                    <div id="map-bg" className="map-container"></div>

                    {/* SIDEBAR DISPATCH CENTER */}
                    <div className="sidebar w-full max-w-sm p-6 flex flex-col">
                        <header className="mb-6">
                            <h1 className="text-2xl font-bold text-slate-900 flex items-center gap-2 mb-1">
                                <span className="text-red-500">🚁</span> LifeStream V3
                            </h1>
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest">Uber for Blood Dispatch</p>
                        </header>

                        <div className="bg-slate-100 rounded-xl p-4 mb-6">
                            <label className="text-xs font-bold text-slate-500 uppercase mb-2 block">Hospital Need</label>
                            <div className="flex flex-wrap gap-2">
                                {bloodTypes.map(type => (
                                    <button
                                        key={type}
                                        onClick={() => setRecipientType(type)}
                                        className={`w-10 h-10 rounded-lg font-bold text-sm transition-all ${
                                            recipientType === type 
                                            ? 'bg-red-500 text-white shadow-md' 
                                            : 'bg-white text-slate-600 border border-slate-200 hover:border-red-300'
                                        }`}
                                    >
                                        {type}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto pr-2 space-y-3 pb-20">
                            <h3 className="text-xs font-bold text-slate-500 uppercase mb-2 sticky top-0 bg-white/90 backdrop-blur-sm py-1">AI Match Scoring</h3>
                            
                            {matches.map(donor => (
                                <div key={donor.id} className="blood-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden">
                                    <div className="flex justify-between items-start mb-2">
                                        <div>
                                            <h4 className="font-bold text-slate-800 text-sm flex items-center gap-1">
                                                {donor.name}
                                                <span className="bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded text-[10px]">{donor.bloodType}</span>
                                            </h4>
                                            <p className="text-[10px] text-slate-500 font-medium mt-0.5">📍 {donor.distanceMiles} mi away</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-xs font-bold text-green-600 bg-green-50 px-2 py-0.5 rounded-full border border-green-100">
                                                {donor.aiScore}% Match
                                            </div>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => handleDispatch(donor.id)}
                                        disabled={!!activeDispatch}
                                        className="w-full bg-slate-900 text-white py-2 rounded-lg text-xs font-bold hover:bg-slate-800 transition-colors disabled:opacity-30 flex justify-center items-center gap-2"
                                    >
                                        Deploy Transport
                                    </button>
                                </div>
                            ))}
                            {matches.length === 0 && <p className="text-sm text-slate-400 text-center mt-10">No donors found nearby.</p>}
                        </div>
                    </div>

                    {/* LIVE TRACKING OVERLAY */}
                    {activeDispatch && (
                        <div className="tracking-overlay animate-[slide-in_0.3s_ease-out]">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-2">
                                    <div className="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
                                    <h3 className="font-bold text-slate-800 text-sm tracking-wide">ACTIVE DISPATCH</h3>
                                </div>
                                <span className="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-bold">
                                    {activeDispatch.transportType}
                                </span>
                            </div>
                            
                            <div className="bg-slate-50 border border-slate-100 rounded-xl p-3 mb-4 flex justify-between items-center">
                                <div>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase">Est. Arrival</p>
                                    <p className="text-xl font-black text-slate-800">{activeDispatch.etaMinutes} min</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-[10px] font-bold text-slate-400 uppercase">IoT Temp Log</p>
                                    <p className={`text-lg font-black ${activeDispatch.tempCelsius > 5.0 ? 'text-orange-500' : 'text-blue-500'}`}>
                                        {activeDispatch.tempCelsius.toFixed(1)}°C
                                    </p>
                                </div>
                            </div>

                            <div className="text-xs text-slate-500 font-medium">
                                En route from <strong className="text-slate-800">{activeDispatch.donorName}</strong> to SF General Hospital.
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
